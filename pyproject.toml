[project]
name = "sae-steering"
version = "0.1.0"
description = "Интерпретируемое управление поведением LLM с помощью Sparse Autoencoders"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1",
    "sae-lens>=6.55",
    "torch>=2.8",
    "transformer-lens>=3,<4",
    "transformers>=5",
]

[dependency-groups]
eda = [
    "datasets>=4",
    "ipywidgets",
    "jupyterlab",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly>=6",
    "pyarrow",
    "pyyaml",
    "tokenizers",
]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.uv]
default-groups = ["eda", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae_steering"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
